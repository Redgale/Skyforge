<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Skyforge Prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Ensure the HTML/body fill the viewport, no scrollbars */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Container for Phaser to inject into */
    #game-container {
      width: 100%;
      height: 100%;
    }

    /* Stretch the canvas to fill its container */
    #game-container canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
